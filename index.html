<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schichtplanung</title>
<script src="https://cdn.tailwindcss.com"></script>
<style type="text/tailwindcss">
.card{@apply bg-white p-4 rounded-xl shadow space-y-3}
.inp{@apply w-full p-2 border border-slate-300 rounded-lg text-sm bg-white}
.btn{@apply px-3 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white hover:bg-blue-700}
.btn2{@apply px-2 py-1 rounded text-xs font-semibold bg-slate-100 border hover:bg-slate-200}
.lbl{@apply block text-xs font-medium text-slate-600 mb-1}
th,td{@apply p-2 text-left}
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-3 sm:p-6">
<div class="max-w-4xl mx-auto">
<div id="load" class="text-center p-10 text-slate-500">Lade Daten …</div>

<div id="auth" class="hidden max-w-sm mx-auto card mt-10">
  <h1 class="text-xl font-bold text-center">Anmelden</h1>
  <form id="authForm" class="space-y-3">
    <div><label class="lbl">Benutzername</label><input id="au" required class="inp" autocomplete="username"></div>
    <div><label class="lbl">Passwort</label><input id="ap" type="password" required class="inp" autocomplete="current-password"></div>
    <button class="btn w-full">Einloggen</button>
  </form>
</div>

<div id="app" class="hidden space-y-4">
  <header class="flex justify-between items-center bg-white rounded-xl shadow px-4 py-3">
    <h1 class="text-xl font-bold">Schichtplanung</h1>
    <div class="text-sm">Angemeldet: <b id="who" class="text-blue-600"></b> <button id="logout" class="btn2 ml-2">Abmelden</button></div>
  </header>
  <nav id="tabs" class="flex gap-2 flex-wrap"></nav>

  <section id="t-form" class="card">
    <h2 id="f-title" class="font-bold text-lg">Schicht eintragen</h2>
    <form id="form" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div id="f-user-w" class="hidden"><label class="lbl">Mitarbeiter</label><select id="f-user" class="inp"></select></div>
      <div><label class="lbl">Datum</label><input type="date" id="f-date" required class="inp"></div>
      <div><label class="lbl">Schicht ab</label><select id="f-start" required class="inp"></select></div>
      <div><label class="lbl">Pause</label><select id="f-break" required class="inp"></select></div>
      <div class="flex items-center gap-2"><input type="checkbox" id="f-ho" class="w-4 h-4"><label for="f-ho" class="text-sm font-medium">Homeoffice (zählt nicht zu den 16 Büroplätzen)</label></div>
      
      <!-- Visueller Raumplan mit exakter Raumaufteilung (Insel-Layout) -->
      <div id="f-desk-w" class="hidden sm:col-span-2 space-y-2 pt-2 border-t">
        <div class="flex justify-between items-center">
          <label class="lbl !mb-0">Büro-Raumplan (P1–P16) – Klick auf einen freien Platz wählt diesen aus:</label>
          <span id="f-desk-selected" class="text-xs font-semibold text-blue-600">Kein Platz gewählt</span>
        </div>
        <input type="hidden" id="f-desk">
        <div id="plan-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-1"></div>
      </div>

      <div class="sm:col-span-2 flex gap-2 pt-2">
        <button id="f-submit" class="btn">Schicht eintragen</button>
        <button type="button" id="f-cancel" class="btn2 hidden">Abbrechen</button>
      </div>
    </form>
  </section>

  <section id="t-mine" class="card hidden"><h2 class="font-bold text-lg">Meine Schichten</h2><div id="mine"></div></section>

  <section id="t-plan" class="card hidden">
    <div class="flex flex-wrap justify-between items-center gap-2">
      <h2 id="p-head" class="font-bold text-lg"></h2>
      <div class="flex gap-2 items-center"><input type="date" id="p-date" class="inp !w-auto"><button id="csv" class="btn2 hidden">CSV-Export</button></div>
    </div>
    
    <!-- Visueller Raumplan in der Tagesplan-Übersicht -->
    <div id="p-desk-overview-w" class="hidden pt-2 border-t space-y-2">
      <h3 class="font-bold text-sm text-slate-700">Sitzplan-Übersicht für diesen Tag</h3>
      <div id="p-plan-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-1"></div>
    </div>

    <div id="plan-tbl" class="pt-2"></div>
  </section>

  <section id="t-users" class="card hidden">
    <h2 class="font-bold text-lg">Mitarbeiterverwaltung</h2>
    <form id="uform" class="flex flex-wrap gap-2">
      <input id="u-name" placeholder="Vorname / Benutzername" required class="inp !w-auto flex-1">
      <input id="u-pw" placeholder="Start-Passwort" required class="inp !w-auto flex-1">
      <button class="btn">Anlegen</button>
    </form>
    <div id="ulist" class="pt-2"></div>
    <div id="ushifts" class="pt-4 border-t"></div>
  </section>

  <section id="t-set" class="card hidden">
    <h2 class="font-bold text-lg">Einstellungen</h2>
    <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="desktog" class="w-4 h-4"> Platzwahl (P1–P16) aktivieren</label>
    <div class="pt-3 border-t"><button id="adminpw" class="btn2 !px-3 !py-2">Admin-Passwort ändern</button></div>
  </section>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getFirestore,doc,collection,setDoc,onSnapshot,runTransaction,writeBatch} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const db=getFirestore(initializeApp({
  apiKey:"AIzaSyD_1D3R8gywh07q-FZ55HL9lcxNgtd5FJM",
  authDomain:"arbeitsplatzbuchung-a0f93.firebaseapp.com",
  projectId:"arbeitsplatzbuchung-a0f93",
  storageBucket:"arbeitsplatzbuchung-a0f93.firebasestorage.app",
  messagingSenderId:"527612842869",
  appId:"1:527612842869:web:fc5559629841724321b93c"
}));

const $=id=>document.getElementById(id);
const MAX=16, D=Array.from({length:MAX},(_,i)=>'P'+(i+1));
let viewUser=null, me=localStorage.getItem('sp_user'), users=[], shifts=[], settings={desks:false}, editId=null, tab='form';
const ready={u:0,s:0,c:0};

const isAdmin=()=>!!me&&me.toLowerCase()==='admin';
const same=(a,b)=>String(a).toLowerCase()===String(b).toLowerCase();
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const isWeekend=s=>{if(!s)return false;const[y,m,d]=s.split('-').map(Number);const w=new Date(y,m-1,d).getDay();return w===0||w===6;};
const nextWeekday=()=>{const d=new Date();while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);return iso(d);};
const WE_MSG='Schichten sind nur von Montag bis Freitag möglich.';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validName=n=>/^[\p{L}\p{N}._-]{1,40}$/u.test(n||'');
const NAME_MSG='Der Benutzername darf nur Buchstaben, Zahlen, Punkt, Unterstrich und Bindestrich enthalten.';
const sid=(date,name)=>`${date}_${name.toLowerCase()}`;
const lockId=(date,desk)=>`${date}_${desk}`;
const fmt=s=>{if(!s)return '';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});};
const leadOk=s=>{if(isAdmin())return true;const[y,m,d]=s.split('-').map(Number);return new Date()<=new Date(y,m-1,d-1,14,0,0);};
const leadAlert=()=>alert('Änderungen sind für diesen Tag nur bis 14:00 Uhr des Vortages möglich. Bitte wende dich an den Overhead.');
const run=async f=>{try{await f();return true;}catch(e){alert(e.message||'Speichern fehlgeschlagen.');return false;}};

// Auswahllisten initialisieren
$('f-start').innerHTML='<option value="">Uhrzeit wählen</option>'+Array.from({length:13},(_,i)=>{const t=`${pad(11+Math.floor(i/2))}:${i%2?'30':'00'}`;return `<option value="${t}">${t} Uhr</option>`;}).join('');
$('f-break').innerHTML='<option value="">Pause wählen</option>'+[0,15,30,45,60,75,90].map(m=>`<option>${m} Minuten</option>`).join('');

// Live-Daten aus Firestore laden
const fail=e=>{$('load').classList.remove('hidden');$('load').textContent='Verbindung zur Datenbank fehlgeschlagen: '+e.message;};
onSnapshot(collection(db,'users'),s=>{users=s.docs.map(d=>d.data());ready.u=1;render();},fail);
onSnapshot(collection(db,'shifts'),s=>{shifts=s.docs.map(d=>({...d.data(),id:d.id}));ready.s=1;render();},fail);
onSnapshot(doc(db,'settings','main'),s=>{settings=s.exists()?s.data():{desks:false};ready.c=1;render();},fail);

// Authentifizierung
$('authForm').onsubmit=async e=>{
  e.preventDefault();
  const n=$('au').value.trim(), p=$('ap').value;
  if(!validName(n))return alert(NAME_MSG);
  let u=users.find(x=>same(x.username,n));
  if(!u&&same(n,'admin')){
    if(p.length<8)return alert('Erster Start: Bitte ein Admin-Passwort mit mindestens 8 Zeichen wählen.');
    if(!confirm('Es gibt noch kein Admin-Konto. Mit diesem Passwort anlegen?'))return;
    u={username:'Admin',password:p};
    if(!await run(()=>setDoc(doc(db,'users','admin'),u)))return;
  }
  if(!u||u.password!==p)return alert('Ungültige Anmeldedaten.');
  me=u.username;localStorage.setItem('sp_user',me);
  $('au').value='';$('ap').value='';tab='form';render();
};
$('logout').onclick=()=>{me=null;localStorage.removeItem('sp_user');resetForm();render();};

// Render-Zentrale
function render(){
  if(!(ready.u&&ready.s&&ready.c))return;
  $('load').classList.add('hidden');
  if(me&&!users.some(u=>same(u.username,me))){me=null;localStorage.removeItem('sp_user');}
  $('auth').classList.toggle('hidden',!!me);
  $('app').classList.toggle('hidden',!me);
  if(!me)return;
  $('who').textContent=me;
  $('f-user-w').classList.toggle('hidden',!isAdmin());
  $('desktog').checked=!!settings.desks;
  fillUsers();tabs();renderForm();renderPlan();renderMine();renderUsers();
}

function tabs(){
  const t=isAdmin()?[['form','Schicht eintragen'],['plan','Tagesplan'],['users','Mitarbeiter'],['set','Einstellungen']]
                   :[['form','Schicht eintragen'],['mine','Meine Schichten'],['plan','Tagesplan']];
  if(!t.some(x=>x[0]===tab))tab='form';
  $('tabs').innerHTML=t.map(([k,l])=>`<button data-tab="${k}" class="btn2 !px-3 !py-2 ${k===tab?'!bg-blue-600 !text-white':''}">${l}</button>`).join('');
  ['form','mine','plan','users','set'].forEach(k=>$('t-'+k).classList.toggle('hidden',k!==tab));
}

function fillUsers(){
  const v=$('f-user').value;
  $('f-user').innerHTML='<option value="">Mitarbeiter wählen</option>'+users.filter(u=>!same(u.username,'admin')).map(u=>`<option>${esc(u.username)}</option>`).join('');
  $('f-user').value=v;
}

// Hilfsfunktion zur Generierung der Schreibtisch-Inseln in exakter Raumaufteilung:
// Jede Insel (4 Plätze) wird als 2x2 Grid dargestellt:
// [ Platz 2 (oben links) | Platz 4 (oben rechts) ]
// [ Platz 1 (unten links)| Platz 3 (unten rechts) ]
function renderIslandHTML(islandIdx, takenMap, interactive, selectedDesk) {
  const base = islandIdx * 4;
  // Indizes im Array D (0-15): base+1 (unten links), base+3 (oben links), base+0 (unten rechts), base+2 (oben rechts)
  const p1 = D[base + 1]; // unten links
  const p2 = D[base + 3]; // oben links
  const p3 = D[base + 0]; // unten rechts
  const p4 = D[base + 2]; // oben rechts

  const renderDeskCell = (d) => {
    const occ = takenMap[d];
    if (occ) {
      return `<div class="rounded bg-red-500 text-white text-xs p-2 truncate text-center cursor-not-allowed" title="Belegt von: ${esc(occ)}">${d}<br><span class="text-[10px] opacity-90">${esc(occ)}</span></div>`;
    }
    if (!interactive) {
      return `<div class="rounded bg-slate-50 border border-slate-200 text-slate-400 text-xs p-2 text-center">${d}<br><span class="text-[10px]">-</span></div>`;
    }
    const isSel = selectedDesk === d;
    return `<button type="button" data-desk="${d}" class="rounded border text-xs p-2 text-center transition-colors ${isSel?'bg-blue-600 text-white font-bold border-blue-600':'bg-white hover:bg-slate-50 text-slate-700'}">${d}</button>`;
  };

  return `
    <div class="bg-amber-50 border border-amber-200 rounded-lg p-2">
      <div class="text-xs text-slate-500 mb-1 font-medium">Insel ${islandIdx + 1}</div>
      <div class="grid grid-cols-2 gap-1">
        ${renderDeskCell(p2)}
        ${renderDeskCell(p4)}
        ${renderDeskCell(p1)}
        ${renderDeskCell(p3)}
      </div>
    </div>
  `;
}

// Visueller Raumplan im Formular
function renderForm(){
  const date=$('f-date').value, on=settings.desks&&!$('f-ho').checked;
  $('f-desk-w').classList.toggle('hidden',!on);
  if(!on){
    $('f-desk').value='';
    return;
  }
  const taken={};
  shifts.filter(s=>s.date===date&&s.desk&&s.id!==editId).forEach(s=>taken[s.desk]=s.name);
  
  const cur=$('f-desk').value;
  if(cur && taken[cur]){
    $('f-desk').value='';
  }
  const sel=$('f-desk').value;
  $('f-desk-selected').textContent = sel ? `Ausgewählt: ${sel}` : 'Kein Platz gewählt';

  $('plan-grid').innerHTML = [0,1,2,3].map(i => renderIslandHTML(i, taken, true, sel)).join('');
}

function tbl(l,nm,dt,act){
  if(!l.length)return '<p class="text-slate-400 text-center p-3 text-sm">Keine Schichten.</p>';
  const dk=settings.desks;
  return `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-slate-500 border-b">${nm?'<th>Name</th>':''}${dt?'<th>Datum</th>':''}<th>Typ</th>${dk?'<th>Platz</th>':''}<th>Zeit</th><th>Pause</th>${act?'<th></th>':''}</tr></thead><tbody>`+
  l.map(s=>{
    const can=act&&(isAdmin()||same(s.name,me));
    return `<tr class="border-b">${nm?`<td class="font-semibold">${esc(s.name)}</td>`:''}${dt?`<td>${fmt(s.date)}</td>`:''}<td class="font-semibold ${s.isHO?'text-purple-600':''}">${s.isHO?'HO':'Büro'}</td>${dk?`<td>${esc(s.desk||'-')}</td>`:''}<td>ab ${esc(s.start)} Uhr</td><td>${esc(s.breakTime)}</td>${act?`<td class="whitespace-nowrap">${can?`<button class="btn2" data-edit="${esc(s.id)}">Ändern</button> <button class="btn2 !text-red-600" data-del="${esc(s.id)}">Löschen</button>`:''}</td>`:''}</tr>`;
  }).join('')+'</tbody></table></div>';
}

function renderPlan(){
  const d=$('p-date').value, l=shifts.filter(s=>s.date===d).sort((a,b)=>a.start.localeCompare(b.start));
  const o=l.filter(s=>!s.isHO).length;
  $('p-head').textContent=`${fmt(d)}: Büro ${o}/${MAX}, Homeoffice ${l.length-o}`;
  
  // Raumplan in der Tagesansicht einblenden, falls Platzwahl aktiv
  const showDeskOverview = settings.desks;
  $('p-desk-overview-w').classList.toggle('hidden', !showDeskOverview);
  if(showDeskOverview) {
    const taken={};
    l.filter(s=>s.desk).forEach(s=>taken[s.desk]=s.name);
    $('p-plan-grid').innerHTML = [0,1,2,3].map(i => renderIslandHTML(i, taken, false, null)).join('');
  }

  $('plan-tbl').innerHTML=tbl(l,true,false,isAdmin());
  $('csv').classList.toggle('hidden',!isAdmin());
}

function renderMine(){
  if(!me)return;
  $('mine').innerHTML=tbl(shifts.filter(s=>same(s.name,me)).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start)),false,true,true);
}

// Mitarbeiterverwaltung mit erweiterter Detailansicht
function renderUsers(){
  if(!isAdmin())return;
  const l=users.filter(u=>!same(u.username,'admin'));
  $('ulist').innerHTML=l.length?'<table class="w-full text-sm"><tbody>'+l.map(u=>`<tr class="border-b"><td class="font-semibold">${esc(u.username)}</td><td class="text-right whitespace-nowrap"><button class="btn2" data-shifts="${esc(u.username)}">Schichten anzeigen</button> <button class="btn2" data-pw="${esc(u.username)}">Passwort</button> <button class="btn2 !text-red-600" data-deluser="${esc(u.username)}">Löschen</button></td></tr>`).join('')+'</tbody></table>':'<p class="text-slate-400 text-sm">Noch keine Mitarbeiter angelegt.</p>';
  if(viewUser&&!users.some(u=>same(u.username,viewUser)))viewUser=null;
  $('ushifts').innerHTML=viewUser?`<div class="flex justify-between items-center pb-2"><h3 class="font-bold text-base">Schichten von ${esc(viewUser)}</h3><button class="btn2" data-closeshifts="1">Schließen</button></div>`+tbl(shifts.filter(s=>same(s.name,viewUser)).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start)),false,true,true):'';
}

// Transaktionssicheres Speichern
async function saveShift(sh,old){
  const id=sid(sh.date,sh.name);
  await runTransaction(db,async t=>{
    const ref=doc(db,'shifts',id), cur=await t.get(ref);
    if(cur.exists()&&(!old||old.id!==id))throw new Error(`${sh.name} hat am ${fmt(sh.date)} bereits eine Schicht.`);
    let lk=null;
    if(sh.desk){
      lk=doc(db,'desks',lockId(sh.date,sh.desk));
      const l=await t.get(lk);
      if(l.exists()&&(!old||l.data().shift!==old.id))throw new Error(`Platz ${sh.desk} ist am ${fmt(sh.date)} bereits belegt.`);
    }
    if(old){
      t.delete(doc(db,'shifts',old.id));
      if(old.desk)t.delete(doc(db,'desks',lockId(old.date,old.desk)));
    }
    t.set(ref,sh);
    if(lk)t.set(lk,{shift:id});
  });
}

$('form').onsubmit=async e=>{
  e.preventDefault();
  const old=editId?shifts.find(s=>s.id===editId):null;
  if(editId&&!old)return alert('Diese Schicht existiert nicht mehr.');
  const name=old?old.name:(isAdmin()?$('f-user').value:me);
  if(!name)return alert('Bitte einen Mitarbeiter wählen.');
  const date=$('f-date').value, isHO=$('f-ho').checked;
  const deskVal = (settings.desks && !isHO) ? $('f-desk').value : '';
  if(!isHO && settings.desks && !deskVal) {
    if(!confirm('Es wurde kein fester Arbeitsplatz ausgewählt. Fortfahren ohne Platz?')) return;
  }
  const sh={name,date,start:$('f-start').value,breakTime:$('f-break').value,isHO,desk:deskVal};
  if(isWeekend(date))return alert(WE_MSG);
  if(!leadOk(date)||(old&&!leadOk(old.date)))return leadAlert();
  if(!isHO&&shifts.filter(s=>s.date===date&&!s.isHO&&s.id!==editId).length>=MAX)
    return alert(`Alle ${MAX} Büroplätze sind an diesem Tag vergeben. Homeoffice ist weiterhin möglich.`);
  if(!await run(()=>saveShift(sh,old)))return;
  if(isAdmin())$('p-date').value=date;
  tab=isAdmin()?(viewUser?'users':'plan'):'mine';
  resetForm();render();
};

function startEdit(id){
  const s=shifts.find(x=>x.id===id); if(!s)return;
  if(!leadOk(s.date))return leadAlert();
  editId=id;
  $('f-user').value=s.name;$('f-user').disabled=true;
  $('f-date').value=s.date;$('f-start').value=s.start;$('f-break').value=s.breakTime;$('f-ho').checked=!!s.isHO;
  $('f-desk').value=s.desk||'';
  renderForm();
  $('f-title').textContent='Schicht ändern';$('f-submit').textContent='Änderung speichern';$('f-cancel').classList.remove('hidden');
  tab='form';tabs();
}

function resetForm(){
  editId=null;$('form').reset();$('f-user').disabled=false;
  $('f-date').value=nextWeekday();
  $('f-desk').value='';
  $('f-title').textContent='Schicht eintragen';$('f-submit').textContent='Schicht eintragen';$('f-cancel').classList.add('hidden');
  renderForm();
}
$('f-cancel').onclick=()=>{resetForm();render();};

async function removeShift(id){
  const s=shifts.find(x=>x.id===id); if(!s)return;
  if(!isAdmin()&&!same(s.name,me))return alert('Du darfst nur eigene Schichten löschen.');
  if(!leadOk(s.date))return leadAlert();
  if(!confirm(`Schicht von ${s.name} am ${fmt(s.date)} löschen?`))return;
  await run(()=>{
    const b=writeBatch(db);
    b.delete(doc(db,'shifts',s.id));
    if(s.desk)b.delete(doc(db,'desks',lockId(s.date,s.desk)));
    return b.commit();
  });
}

// Admin Mitarbeiterverwaltung
$('uform').onsubmit=async e=>{
  e.preventDefault();
  const n=$('u-name').value.trim(), p=$('u-pw').value;
  if(!validName(n))return alert(NAME_MSG);
  if(same(n,'admin'))return alert('Der Name "admin" ist reserviert.');
  if(users.some(u=>same(u.username,n)))return alert('Dieser Benutzername existiert bereits.');
  if(await run(()=>setDoc(doc(db,'users',n.toLowerCase()),{username:n,password:p})))$('uform').reset();
};

async function changePw(name){
  const p=prompt(`Neues Passwort für ${name}:`); if(!p)return;
  await run(()=>setDoc(doc(db,'users',name.toLowerCase()),{username:name,password:p}));
}

async function deleteUser(name){
  if(!confirm(`Benutzer "${name}" und alle seine Schichten löschen?`))return;
  if(same(viewUser,name)) viewUser=null;
  await run(()=>{
    const b=writeBatch(db);
    b.delete(doc(db,'users',name.toLowerCase()));
    shifts.filter(s=>same(s.name,name)).forEach(s=>{
      b.delete(doc(db,'shifts',s.id));
      if(s.desk)b.delete(doc(db,'desks',lockId(s.date,s.desk)));
    });
    return b.commit();
  });
}

$('desktog').onchange=()=>run(()=>setDoc(doc(db,'settings','main'),{desks:$('desktog').checked}));

$('adminpw').onclick=async()=>{
  const cur=users.find(u=>same(u.username,'admin'));
  if(!isAdmin()||!cur)return;
  if(prompt('Aktuelles Admin-Passwort:')!==cur.password)return alert('Das aktuelle Passwort ist falsch.');
  const p=prompt('Neues Admin-Passwort (mindestens 8 Zeichen):');
  if(!p)return;
  if(p.length<8)return alert('Das Passwort muss mindestens 8 Zeichen lang sein.');
  if(await run(()=>setDoc(doc(db,'users','admin'),{username:'Admin',password:p})))alert('Admin-Passwort wurde geändert.');
};

// CSV Export
$('csv').onclick=()=>{
  const d=$('p-date').value, l=shifts.filter(s=>s.date===d).sort((a,b)=>a.start.localeCompare(b.start));
  if(!l.length)return alert('Für diesen Tag gibt es keine Schichten.');
  const q=v=>{let t=String(v??'');if(/^\s*[=+\-@]/.test(t))t="'"+t;return `"${t.replace(/"/g,'""')}"`;};
  const rows=['Mitarbeiter;Platz;Typ;Uhrzeit;Pause;Datum',...l.map(s=>[s.name,s.desk||'-',s.isHO?'HO':'Büro',`ab ${s.start} Uhr`,s.breakTime,fmt(s.date)].map(q).join(';'))];
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8;'}));
  a.download=`Schichtplan_${d}.csv`;a.click();URL.revokeObjectURL(a.href);
};

// Event Delegation & Handler
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-desk],[data-edit],[data-del],[data-pw],[data-deluser],[data-shifts],[data-closeshifts]'); if(!t)return;
  const d=t.dataset;
  if(d.tab){tab=d.tab;tabs();}
  else if(d.desk){$('f-desk').value=d.desk;renderForm();}
  else if(d.edit)startEdit(d.edit);
  else if(d.del)removeShift(d.del);
  else if(d.shifts){viewUser=d.shifts;renderUsers();}
  else if(d.closeshifts){viewUser=null;renderUsers();}
  else if(d.pw)changePw(d.pw);
  else if(d.deluser)deleteUser(d.deluser);
});

['f-date','f-ho'].forEach(id=>$(id).addEventListener('change',renderForm));
$('f-date').addEventListener('change',()=>{if(isWeekend($('f-date').value)){alert(WE_MSG);$('f-date').value=nextWeekday();renderForm();}});
$('p-date').addEventListener('change',renderPlan);

$('f-date').value=nextWeekday();
$('p-date').value=today();
</script>
</body>
</html>
